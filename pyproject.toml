[project]
name = "dota2-map-assistant"
version = "0.3.0"
description = "Dota 2 chat translator with local M2M100 CTranslate2 INT8 inference."
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10",
    "certifi>=2024.2",
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.1",
    "numpy>=2,<3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "dota2-map-assistant"
version = "0.4.8"
description = "Lightweight offline Dota 2 chat translator with editable phrase presets."
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10",
    "certifi>=2024.2",
    "psutil==7.2.2",
    "ctranslate2==4.8.2",
    "sentencepiece==0.2.1",
    "numpy==2.5.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

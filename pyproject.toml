[project]
name = "dota2-map-assistant"
version = "0.4.1"
description = "Offline Dota 2 chat translator with contextual local GGUF inference."
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10",
    "certifi>=2024.2",
    "psutil==7.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

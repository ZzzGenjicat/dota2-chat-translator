name: Native Mac offline release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the tested package version to GitHub Releases'
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements.txt
      - name: Run Windows regression tests
        env:
          PYTHONPATH: src
          DOTA2_TRANSLATOR_DATA_DIR: ${{ runner.temp }}/dota-test-data
        run: python -u -X utf8 tools/run_tests.py

  macos-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Install native build dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-build.txt
      - name: Run Mac regression tests
        timeout-minutes: 10
        env:
          DOTA2_TRANSLATOR_DATA_DIR: ${{ runner.temp }}/dota-test-data
        run: python -u -X utf8 tools/run_tests.py
      - name: Prepare and verify pinned offline model
        run: python tools/install_offline_model.py
      - name: Test source with remote connections blocked
        run: python -X utf8 run.py --self-test --report build/source-smoke.json
      - name: Build and test relocated native app, then make DMG
        run: python tools/build_macos.py --arch '${{ matrix.arch }}'
      - name: Save validated installers and reports
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          compression-level: 0
      - name: Save diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.arch }}
          path: |
            build/source-smoke.json
            release/*-smoke.json
            build/pyinstaller/**/warn-*.txt
          if-no-files-found: ignore

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [windows-regression, macos-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: release
          merge-multiple: true
      - name: Publish tested Mac preview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$RELEASE_TAG" == "$PACKAGE_TAG" ]] || { echo 'Version tag and package version differ'; exit 1; }
          else
            RELEASE_TAG="$PACKAGE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')"
            [[ "$TAG_COMMIT" == "$GITHUB_SHA" ]] || { echo 'Increase the package version before publishing changed source'; exit 1; }
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --prerelease \
              --title "$RELEASE_TAG · Mac 本地离线预览版" --notes-file packaging/release_notes.md
          fi
